name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Test
        run: go test ./cmd/... ./internal/...

  build:
    needs: test
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow default, so contents:write is
    # restated here next to the two the attestation step needs.
    permissions:
      contents: write       # create the release, upload dist/*
      id-token: write       # OIDC token Sigstore signs against - there is no key to manage
      attestations: write   # record the attestation against the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git describe sees the tag
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Cross-compile
        run: make release
      # Signs each binary's digest against this workflow run, keylessly, through
      # Sigstore and the GitHub OIDC token. Runs BEFORE publish so a signing
      # failure fails the release instead of shipping unsigned binaries.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
